<!--
  가입 인증번호 메일.
  Supabase > Authentication > Emails > Templates > Confirm signup 에 넣는다.

    제목(Subject)      THE PIECE 주보 가입 인증번호
    본문(Message body) 이 파일에서 아래 주석을 뺀 나머지 전부 (주석째 붙여넣어도 상관없다)

  {{ .Token }} 이 인증번호로 바뀐다. 이것을 빼고 {{ .ConfirmationURL }} 을 넣으면
  다시 링크 방식으로 돌아가므로, 가입 화면의 인증번호 입력칸이 무용지물이 된다.

  자릿수는 Supabase > Authentication > Providers > Email > Email OTP Length 가 정한다.
  화면의 입력칸(CODE_LENGTH)과 그 값이 어긋나면 번호를 넣어도 계속 틀렸다고 나온다.
  여기 문구에 자릿수를 적지 않은 것은 그 때문이다 — 설정을 바꿔도 메일이 거짓말을 하지 않는다.

  ---------------------------------------------------------------- 메일 HTML 규칙

  1. style 안에 따옴표를 쓰지 않는다.
     font-family:'Apple SD Gothic Neo' 처럼 적으면 메일 쪽 CSS 검사기가 그 줄을 못 읽고
     같은 style에 있던 padding·text-align·font-size까지 통째로 버린다.
     여백과 가운데정렬이 한꺼번에 사라지는 것이 이 증상이다. 폰트 이름은 따옴표 없이 적는다.

  2. 정렬은 align="center" 속성으로도 함께 건다.
     CSS가 버려져도 속성은 남는다.

  3. 글자 모양은 상속에 기대지 않는다.
     바깥 칸에 적어두고 안쪽 div가 물려받기를 바라면 어떤 메일 프로그램에서는 초기값으로 돌아간다.
     글자가 들어 있는 칸마다 font-family·font-size·color 를 직접 적는다.

  4. CSS 파일도, SVG도 읽지 못한다.
     칸은 표(table)로 잡고 색은 태그마다 적는다.
     퍼즐 로고는 네 조각을 색칸 네 개로 다시 그렸다(각 조각의 바깥 모서리만 크게 굴린다).
     모서리 굴림을 못 읽는 옛 아웃룩에서는 네모 넷으로 보이는데, 그래도 로고로 읽힌다.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6f8;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">

        <!-- ---------------------------------------------------------- 퍼즐 조각 넷 -->
        <tr>
          <td align="center" style="padding:0 0 12px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
              <tr>
                <td width="22" height="22" style="width:22px;height:22px;background-color:#41508F;border-radius:10px 3px 3px 3px;font-size:0;line-height:0;">&nbsp;</td>
                <td width="3" style="width:3px;font-size:0;line-height:0;">&nbsp;</td>
                <td width="22" height="22" style="width:22px;height:22px;background-color:#4FA391;border-radius:3px 10px 3px 3px;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
              <tr>
                <td height="3" style="height:3px;font-size:0;line-height:0;">&nbsp;</td>
                <td height="3" style="height:3px;font-size:0;line-height:0;">&nbsp;</td>
                <td height="3" style="height:3px;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
              <tr>
                <td width="22" height="22" style="width:22px;height:22px;background-color:#F0A94C;border-radius:3px 3px 3px 10px;font-size:0;line-height:0;">&nbsp;</td>
                <td width="3" style="width:3px;font-size:0;line-height:0;">&nbsp;</td>
                <td width="22" height="22" style="width:22px;height:22px;background-color:#E56B4E;border-radius:3px 3px 10px 3px;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ---------------------------------------------------------- 이름 -->
        <tr>
          <td align="center" style="padding:0 0 20px 0;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#16181d;text-align:center;">
            THE&nbsp;PIECE <span style="color:#767c88;">주보</span>
          </td>
        </tr>

        <!-- ---------------------------------------------------------- 흰 카드 -->
        <tr>
          <td style="background-color:#ffffff;border:1px solid #e6e8ec;border-radius:16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

              <tr>
                <td align="center" style="padding:34px 30px 0 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21px;font-weight:bold;color:#16181d;text-align:center;line-height:1.4;">
                  가입 인증번호
                </td>
              </tr>

              <tr>
                <td align="center" style="padding:10px 30px 0 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:14px;color:#767c88;text-align:center;line-height:1.7;">
                  아래 인증번호를<br>가입 화면에 입력해주세요.
                </td>
              </tr>

              <!-- 인증번호 -->
              <tr>
                <td style="padding:22px 30px 0 30px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef1ff;border:1px solid #dbe1ff;border-radius:12px;">
                    <tr>
                      <td align="center" style="padding:22px 10px;font-family:Apple SD Gothic Neo,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:32px;font-weight:bold;color:#3d5afe;text-align:center;letter-spacing:8px;text-indent:8px;line-height:1.2;">
                        {{ .Token }}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td align="center" style="padding:16px 30px 0 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:13px;color:#767c88;text-align:center;line-height:1.7;">
                  이 번호는 <span style="color:#16181d;font-weight:bold;">1시간</span> 동안만 쓸 수 있습니다.<br>
                  시간이 지났다면 가입 화면에서 다시 받으실 수 있습니다.
                </td>
              </tr>

              <!-- 가르는 선 -->
              <tr>
                <td style="padding:24px 30px 0 30px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td height="1" style="height:1px;background-color:#e6e8ec;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td align="center" style="padding:16px 30px 30px 30px;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:12px;color:#9aa0ab;text-align:center;line-height:1.7;">
                  본인이 신청한 것이 아니라면 이 메일은 무시해주세요.<br>
                  번호를 다른 사람에게 알려주지 마세요.
                </td>
              </tr>

            </table>
          </td>
        </tr>

        <!-- ---------------------------------------------------------- 꼬리말 -->
        <tr>
          <td align="center" style="padding:16px 0 0 0;font-family:Apple SD Gothic Neo,Malgun Gothic,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:11px;color:#9aa0ab;text-align:center;line-height:1.7;">
            우리는 하나님의 퍼즐의 한 조각<br>
            THE PIECE 주보 &middot; 발신 전용 메일입니다
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
